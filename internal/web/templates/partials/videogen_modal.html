{{define "videogen_modal"}}
<dialog id="vg-modal" class="vg-overlay" aria-label="歌曲播放详情" oncancel="event.preventDefault();VideoGen.close()">
    <div id="vg-bg" class="vg-bg-layer">
        <img id="vg-bg-img" class="vg-bg-content is-image" alt="">
        <video id="vg-bg-video" class="vg-bg-content" autoplay loop muted style="display:none;"></video>
    </div>

    <header class="vg-player-header"><button type="button" class="vg-close" onclick="VideoGen.close()" aria-label="收起播放详情" autofocus><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button><div><span>正在播放</span><small id="vg-source"></small></div><button type="button" class="vg-more" onclick="VideoGen.openMore(this)" aria-label="更多播放操作"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i></button></header>

    <div class="vg-container" id="vg-ui-container">
        <div class="vg-left">
            <div class="vg-disc-container" id="vg-disc-container">
                <div class="vg-visualizer" id="vg-visualizer"></div>
                <div class="vg-disc-wrap">
                    <div class="vg-cover-container" id="vg-cover-container">
                        <img id="vg-cover-img" class="vg-cover-content" alt="歌曲封面">
                        <video id="vg-cover-video" class="vg-cover-content" autoplay loop muted style="display:none;"></video>
                    </div>
                </div>
            </div>

            <div class="vg-info">
                <button type="button" class="vg-save-track" onclick="addCurrentTrackToCollection()" aria-label="添加到歌单"><i class="fa-solid fa-circle-plus" aria-hidden="true"></i></button><div id="vg-title" class="vg-title"></div>
                <div id="vg-artist" class="vg-artist"></div>
                <div class="vg-progress-wrapper">
                    <span id="vg-time-current">00:00</span>
                    <input type="range" id="vg-seek-bar" aria-label="播放进度" class="vg-seek-bar" value="0" step="0.1" min="0" max="100">
                    <span id="vg-time-total">00:00</span>
                </div>
                <div class="vg-playback-row">
                    <button type="button" class="vg-ctrl-icon" onclick="VideoGen.playPrev()" aria-label="上一首"><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
                    <button type="button" id="vg-play-button" class="vg-ctrl-icon vg-play-center" onclick="VideoGen.togglePlay()" aria-label="播放或暂停">
                        <i id="vg-play-toggle-icon" class="fa-solid fa-play" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="vg-ctrl-icon" onclick="VideoGen.playNext()" aria-label="下一首"><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
                </div><div class="vg-secondary-row"><button class="vg-queue-button" type="button" onclick="VideoGen.openQueue()"><i class="fa-solid fa-list-ul" aria-hidden="true"></i><span>播放列表</span></button>

                    <div class="vg-vol-group">
                        <button type="button" class="vg-mute-button" onclick="VideoGen.toggleMute()" aria-label="静音或恢复"><i class="fa-solid fa-volume-high" id="vg-vol-icon" aria-hidden="true"></i></button>
                        <input type="range" id="vg-volume-bar" aria-label="音量" class="vg-seek-bar" value="70" step="1" min="0" max="100">
                        <span id="vg-vol-text" class="vg-vol-text">70%</span>
                    </div>

                    <div class="vg-speed-group">
                        <button type="button" id="vg-speed-button" class="vg-speed-button" onclick="VideoGen.toggleSpeedMenu(event)" title="播放速度">1x</button>
                        <div id="vg-speed-menu" class="vg-speed-menu" hidden></div>
                    </div>
                </div>
            </div>

            <div class="vg-tools-panel" id="vg-tools-panel" hidden><h3>音频与视频工具</h3><p>在设置中开启需要的工具后使用。</p><div class="vg-controls" id="vg-controls">
                <div id="vg-feature-change-cover" data-vg-setting="vgChangeCover" style="display:none;">
                    <input type="file" id="vg-file-input" accept="image/*,video/mp4" style="display:none;" onchange="VideoGen.handleFileSelect(this)">
                    <button class="vg-btn-icon" onclick="document.getElementById('vg-file-input').click()" title="更换封面/背景">
                        <i class="fa-regular fa-image"></i>
                    </button>
                </div>

                <div id="vg-feature-change-audio" data-vg-setting="vgChangeAudio" style="display:none;">
                    <input type="file" id="vg-audio-input" accept="audio/*" style="display:none;" onchange="VideoGen.handleAudioSelect(this)">
                    <button class="vg-btn-icon" onclick="document.getElementById('vg-audio-input').click()" title="更换本地音频 (仅限网页预览)">
                        <i class="fa-solid fa-music"></i>
                    </button>
                </div>

                <div id="vg-feature-change-lyric" data-vg-setting="vgChangeLyric" style="display:none;">
                    <input type="file" id="vg-lyric-input" accept=".lrc,.txt" style="display:none;" onchange="VideoGen.handleLyricSelect(this)">
                    <button class="vg-btn-icon" onclick="document.getElementById('vg-lyric-input').click()" title="更换本地歌词 (.lrc)">
                        <i class="fa-solid fa-file-lines"></i>
                    </button>
                </div>

                <div id="vg-feature-export-video" data-vg-setting="vgExportVideo" style="display:none;">
                    <button class="vg-btn-gen" onclick="VideoGen.startRendering()">
                        <i class="fa-solid fa-clapperboard"></i> 导出视频
                    </button>
                </div>
            </div>
        </div></div>

        <div class="vg-right">
            <button type="button" class="vg-lyrics-toggle" aria-expanded="false" aria-controls="vg-lyrics" onclick="VideoGen.toggleLyrics(this)"><span><strong>歌词</strong><small>展开查看歌词</small></span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
            <div id="vg-lyrics" class="vg-lyrics-box" hidden></div>
        </div>
    </div>

    <div id="vg-status-loading" class="vg-status">
        <div style="font-size:30px; margin-bottom:10px;"><i class="fa-solid fa-compact-disc fa-spin"></i></div>
        <h3 id="vg-status-text">正在分析音频...</h3>
        <div class="vg-progress-bar"><div id="vg-progress-fill" class="vg-progress-fill"></div></div>
        <p id="vg-status-sub" style="opacity:0.7; font-size:12px; margin-top:10px;">渲染期间不会影响当前音乐播放</p>
    </div>

    <div id="vg-status-success" class="vg-status">
        <div style="font-size: 60px; color: #48bb78; margin-bottom: 20px;"><i class="fa-solid fa-circle-check"></i></div>
        <h3>生成成功！</h3>
        <div style="display:flex; gap:15px; margin-top:30px;">
            <a id="vg-dl-link" href="#" target="_blank" class="vg-btn-gen" download>
                <i class="fa-solid fa-download"></i> 点击下载
            </a>
            <button onclick="VideoGen.reset()" class="vg-btn-gen">返回</button>
        </div>
    </div>
</dialog>
{{end}}
